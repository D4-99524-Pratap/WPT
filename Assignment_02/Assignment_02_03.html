<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunbeam Registration Form</title>
</head>
<body style="border: 1px solid black; height:500px; width: 850px; padding: 20px;">
    <div align="center">
    <img src="image.png" alt="Sunbeam_Imag" width="600px">

    <h1>Sunbeam Registration Form</h1>
    </div>


    <table>
        <tr>
            <td>
                <div>
                    <iframe 
                    width="480" 
                    height="270" 
                    src="https://youtube.com" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                    </iframe>
                </div>
            </td>
            <td>
                <form action="">
                <table>
                    <tr>
                        <th align="left">Name:</th>
                        <td><input type="text" required></td>
                    </tr>
                    <tr>
                        <th align="left">BirthDate:</th>
                        <td><input type="date" required></td>
                    </tr>
                    <tr>
                        <th align="left">Email:</th>
                        <td><input type="text" required></td>
                    </tr>
                    <tr>
                        <th align="left">Password:</th>
                        <td><input type="password" required></td>
                    </tr>
                    <tr>
                        <th align="left">Address:</th>
                        <td><textarea required>Sunbeam Institute of IT 'Anuda Chambers', 203 Shaniwar Peth, Near Gujar Hospital, Karad-415110 (Maharashtra)</textarea>
                        </td>
                    </tr>
                    <tr>
                        <th align="left">Gender:</th>
                        <td>
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>

                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                        </td>
                    </tr>
                    <tr>
                        <th align="left">Upload Photo:</th>
                        <td><input type="file" required></td>
                    </tr>
                    <tr>
                        <th align="left">Select Your Course:</th>
                        <td>
                            <select id="course" name="course">
                                <option value="">Select course</option>
                                <option value="dac">DAC</option>
                                <option value="dmc">DMC</option>
                                <option value="dbda">DBDA</option>
                                <option value="ditiss">DITISS</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th align="left">Skill Set:</th>
                        <td>
                            <input type="checkbox" id="Java" name="Skill Set" value="Java">
                            <label for="Java">Java</label>

                            <input type="checkbox" id="CPP" name="Skill Set" value="CPP">
                            <label for="CPP">CPP</label>

                            <input type="checkbox" id="OS" name="Skill Set" value="OS">
                            <label for="OS">OS</label>
                        </td>
                    </tr>
                    <tr>
                        <th align="left"></th>
                        <td>
                            <input type="submit" value="Register">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>

                </table>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
